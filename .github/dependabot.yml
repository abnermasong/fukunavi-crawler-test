version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    target-branch: "develop"
    labels:
      - "dependencies"
    cooldown:
      default-days: 3
    open-pull-requests-limit: 10
